apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: op-bundler
  name: op-bundler
  namespace: xainet
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: op-bundler
  template:
    metadata:
      labels:
        app: op-bundler
    spec:
      serviceAccountName: xainet-sa
      containers:
        - name: op-bundler
          imagePullPolicy: Always
          args:
            - standalone
          readinessProbe:
            tcpSocket:
              port: 14337
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

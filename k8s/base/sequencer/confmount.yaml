apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: op-seq
spec:
  template:
    spec:
      initContainers:
        - name: generate-jwt
          volumeMounts:
            - mountPath: "/workspace/config"
              name: workdir-storage
      containers:
        - name: op-geth
          volumeMounts:
            - mountPath: "/workspace/config"
              name: workdir-storage
            - mountPath: "/workspace/op-geth-data"
              name: data-storage
        - name: op-node
          volumeMounts:
            - name: p2p-private-key
              readOnly: true
              mountPath: /secrets/priv.txt
              subPath: priv
            - mountPath: "/workspace/config"
              name: workdir-storage

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: op-seq
  namespace: xainet
spec:
  serviceName: op-seq
  replicas: 1
  selector:
    matchLabels:
      app: op-seq
  template:
    metadata:
      labels:
        app: op-seq
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000   # allinea all'utente dell'immagine
      initContainers:
        - name: generate-jwt
          image: alpine/openssl:3.5.9
          command:
            - sh
            - -c
            - |
              if [ ! -f /workspace/config/jwt.txt ]; then
                openssl rand -hex 32 | tr -d '\n' > /workspace/config/jwt.txt
              fi
      containers:
        - name: op-geth
          image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101702.2
          args:
            - --datadir=/workspace/op-geth-data
            - --http
            - --http.addr=0.0.0.0
            - --http.port=8545
            - --ws
            - --ws.addr=0.0.0.0
            - --ws.port=8546
            - --authrpc.addr=0.0.0.0
            - --authrpc.port=8551
            - --authrpc.jwtsecret=/workspace/config/jwt.txt
            - --syncmode=full
            - --gcmode=archive
            - --rollup.disabletxpoolgossip=true
            - --http.vhosts=*
            - --http.corsdomain=*
            - --http.api=eth,net,web3,debug,txpool,admin,miner
            - --ws.origins=*
            - --ws.api=eth,net,web3,debug,txpool,admin,miner
            - --authrpc.vhosts=*
          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        - name: op-node
          image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.4
          envFrom:
            - configMapRef:
                name: blockchain-config-env
          command:
            - op-node
          args:
            - --l1=$(l1RpcUrl)
            - --l1.beacon=$(l1BeaconUrl)
            - --l2=http://127.0.0.1:8551
            - --l2.jwt-secret=/workspace/config/jwt.txt
            - --rollup.config=/workspace/config/rollup.json
            - --rollup.l1-chain-config=/workspace/config/genesis-l1.json
            - --sequencer.enabled=true
            - --sequencer.stopped=false
            - --verifier.l1-confs=4
            - --p2p.priv.path=/secrets/priv.txt
            - --p2p.listen.ip=0.0.0.0
            - --p2p.listen.tcp=9222
            - --rpc.addr=0.0.0.0
            - --rpc.port=8547
            - --rpc.enable-admin
            - --log.level=info
            - --log.format=json
          readinessProbe:
            tcpSocket:
              port: 8547
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

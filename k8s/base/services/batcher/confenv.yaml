apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-batcher
  namespace: xainet
spec:
  template:
    spec:
      containers:
        - name: op-batcher
          env:
            - name: OP_BATCHER_L1_ETH_RPC
              valueFrom:
                configMapKeyRef:
                  name: blockchain-config-env
                  key: l1RpcUrl
            - name: OP_BATCHER_DATA_AVAILABILITY_TYPE
              valueFrom:
                configMapKeyRef:
                  name: batcher-config-env
                  key: dataAvailabilityType
            - name: OP_BATCHER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: l2-private-key
                  key: batcherPK

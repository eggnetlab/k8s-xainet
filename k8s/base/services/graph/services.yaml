apiVersion: v1
kind: Service
metadata:
  labels:
    app: op-graph
  name: op-graph
spec:
  ports:
    - name: graph-search
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: graph-deploy
      port: 8020
      protocol: TCP
      targetPort: 8020
    - name: graph-status
      port: 8030
      protocol: TCP
      targetPort: 8030
  selector:
    app: op-graph
  type: ClusterIP

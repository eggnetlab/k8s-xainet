apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: op-rep
spec:
  template:
    spec:
      containers:
        - name: op-geth
          volumeMounts:
            - mountPath: "/workspace/config"
              name: workdir-storage
            - mountPath: "/workspace/op-geth-data"
              name: data-storage
        - name: op-node
          volumeMounts:
            - mountPath: "/workspace/config"
              name: workdir-storage

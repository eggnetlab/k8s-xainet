apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-bundler
  namespace: xainet
spec:
  template:
    spec:
      containers:
        - name: op-bundler
          image: etherspot/skandha:v2-2.4.6
          resources:
            limits:
              cpu: 0.5
              memory: 250Mi
            requests:
              cpu: 0.25
              memory: 50Mi

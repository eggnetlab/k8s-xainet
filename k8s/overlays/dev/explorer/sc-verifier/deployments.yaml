apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-verifier
  namespace: xainet
spec:
  template:
    spec:
      containers:
        - name: sc-verifier
          resources:
            requests:
              cpu: "0.1"
              memory: "256Mi"
            limits:
              cpu: "0.1"
              memory: "500Mi"

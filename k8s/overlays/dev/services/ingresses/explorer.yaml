apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: explorer-ingress
  namespace: xainet
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: explorer.xainet.xaidev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: blockscout-backend
                port:
                  number: 4000
          - path: /socket
            pathType: Prefix
            backend:
              service:
                name: blockscout-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blockscout-frontend
                port:
                  number: 3000

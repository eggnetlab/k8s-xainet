apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: op-graph-ingress
  namespace: xainet
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: graph.xainet.xaidev
      http:
        paths:
          - pathType: ImplementationSpecific
            path: "/(.*)"
            backend:
              service:
                name: op-graph
                port:
                  number: 8000

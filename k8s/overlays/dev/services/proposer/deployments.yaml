apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-proposer
spec:
  template:
    spec:
      containers:
        - name: op-proposer
          image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.16.3
          resources:
            limits:
              cpu: 0.1
              memory: 250Mi
            requests:
              cpu: 0.1
              memory: 50Mi

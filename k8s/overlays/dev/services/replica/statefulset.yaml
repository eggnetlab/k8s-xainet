apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: op-rep
spec:
  template:
    spec:
      containers:
        - name: op-geth
          resources:
            limits:
              cpu: 0.25
              memory: 1Gi
            requests:
              cpu: 0.1
              memory: 250Mi
        - name: op-node
          resources:
            limits:
              cpu: 0.25
              memory: 1Gi
            requests:
              cpu: 0.1
              memory: 250Mi

name: l2-tools
help: Local environment management
version: 0.1.0

variables:
  - name: mark
    value: "[@@@ L2-TOOLS]"

commands:
  - name: network
    alias: n
    args:
      - name: name
        help: network name
        required: true
    flags:
      - short: -s
        long: --subnet
        arg: subnet
        help: network subnet
        required: true
    examples:
      - l2-tools network xai-devnet
      - l2-tools network l2-devnet -s 172.26.0
  - name: l1
    help: l1 utilities
    commands:
      - name: start
        help: start l1
        examples:
          - l2-tools l1 start
      - name: stop
        help: stop l1
        examples:
          - l2-tools l1 stop
  - name: bc
    help: bc utilities
    commands:
      - name: start
        help: start bc
        examples:
          - l2-tools bc start
      - name: stop
        help: stop bc
        examples:
          - l2-tools bc stop
      - name: restore
        help: restore bc
        examples:
          - l2-tools bc restore

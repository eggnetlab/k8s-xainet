name: l2-tools
help: Local environment management
version: 0.1.0

variables:
  - name: mark
    value: "[@@@ L2-TOOLS]"

commands:
  - name: network
    alias: n
    args:
      - name: name
        help: network name
        required: true
    flags:
      - short: -s
        long: --subnet
        arg: subnet
        help: network subnet
        required: true
    examples:
      - l2-tools network xai-devnet
      - l2-tools network l2-devnet -s 172.26.0
  - name: l1
    help: l1 utilities
    commands:
      - name: start
        help: start l1
        examples:
          - l2-tools l1 start
      - name: stop
        help: stop l1
        examples:
          - l2-tools l1 stop
  - name: l2
    help: l2 utilities
    commands:
      - name: start
        help: start l2
        examples:
          - l2-tools l2 start
      - name: stop
        help: stop l2
        examples:
          - l2-tools l2 stop
      - name: init
        help: init l2
        examples:
          - l2-tools l2 init
      - name: bundler
        help: start the bundler
        flags:
          - long: --start
            short: -r
            conflicts: [--stop]
            help: run the bundler
          - long: --stop
            short: -s
            conflicts: [--start]
            help: stop the bundler
        examples:
          - l2-tools l2 bundler --start
          - l2-tools l2 bundler --stop
  - name: bc
    help: bc utilities
    commands:
      - name: start
        help: start bc
        examples:
          - l2-tools bc start
      - name: stop
        help: stop bc
        examples:
          - l2-tools bc stop
      - name: restore
        help: restore bc
        examples:
          - l2-tools bc restore
  - name: cluster
    help: cluster utilities
    commands:
      - name: start
        help: start cluster
        flags:
          - long: --profile
            short: -p
            help: Profile name to use
            required: true
            arg: profile
          - long: --network
            short: -n
            help: Network name to use
            required: true
            arg: network
          - long: --ip-address
            short: -a
            help: Ip address to use
            required: true
            arg: ip-address
          - long: --cpus
            short: -c
            help: Amount of cpus to allocate to minikube
            required: false
            arg: cpus
            default: "4"
          - long: --memory
            short: -m
            help: Amount of memory to allocate to minikube
            required: false
            arg: memory
            default: 8g
        examples:
          - l2-tools cluster start -p l2-kube -n l2-kube-net -a 192.168.1.100
          - l2-tools cluster start -p l2-kube -n l2-kube-net -a 192.168.1.100 -c 8 -m 16g
      - name: stop
        help: stop cluster
        flags:
          - long: --profile
            short: -p
            help: Profile name to use
            required: true
            arg: profile
          - long: --clean
            short: -c
            help: Delete cluster
        examples:
          - l2-tools cluster stop
          - l2-tools cluster stop -c
  - name: data
    help: data utilities
    commands:
      - name: start
        help: start data
        examples:
          - l2-tools data start
      - name: stop
        help: stop data
        flags:
          - long: --clean
            short: -c
            help: Delete cluster
        examples:
          - l2-tools data stop
          - l2-tools data stop -c
